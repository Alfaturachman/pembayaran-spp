version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pembayaran-spp-app
    container_name: spp_app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    volumes:
      - .:/var/www
    networks:
      - spp-network

  webserver:
    image: nginx:alpine
    container_name: spp_webserver
    restart: unless-stopped
    tty: true
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - spp-network

  db:
    image: mysql:8.0
    container_name: spp_db
    restart: unless-stopped
    tty: true
    ports:
      - "33061:3306"
    environment:
      MYSQL_DATABASE: pembayaran_spp
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_USER: spp_user
      MYSQL_PASSWORD: secretpassword
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - spp-network

  redis:
    image: redis:alpine
    container_name: spp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - spp-network

networks:
  spp-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
